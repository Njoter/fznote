[package]
name = "fznote"
version = "0.1.0"
edition = "2024"
authors = ["Njoter <stianovesen@proton.me"]
description = "A fuzzy note manager with git integration"
license = "MIT or Apache-2.0"
repository = "https://github.com/Njoter/fznote"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
which = "8.0.6"
